services:
  nginx:
    image: "nginx:stable-bullseye"
    ports:
      - "8000:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx_default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fast-api
      - redis

  fast-api:
    build: .
    image: ${DOCKER_HUB}
    ports:
      - "9000:8000"

  redis:
    image: "redis:alpine"